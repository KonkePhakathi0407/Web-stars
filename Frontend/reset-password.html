<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCare Hub - Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="utils/theme.js"></script>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/reset-password.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Reset Password</h1>
            <p>Enter your email and new password</p>
        </div>
        <div class="content">
            <div class="field-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="student@uj.ac.za">
            </div>
            
            <div class="field-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="At least 8 characters">
                <div class="password-strength">
                    <div class="strength-fill" id="strengthFill"></div>
                </div>
                <div class="strength-text" id="strengthText"></div>
            </div>
            
            <div class="field-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your new password">
            </div>
            
            <button id="resetBtn">Reset Password</button>
            
            <div id="message" class="message"></div>
            <div class="back-link">
                <a href="signin.html">Back to Sign In</a>
            </div>
        </div>
    </div>

    <script src="javascript/reset-password.js"></script>
</body>
</html>
